[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "english_bot"
version = "0.1.0"
description = "A Telegram bot for English grammar checking and vocabulary practice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==22.7",
    "language-tool-python==3.3.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.10",
]

[project.scripts]
english-bot = "src.bot:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
